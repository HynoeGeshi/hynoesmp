name: Publish verified site help final branch
on:
  push:
    branches: [feature/site-help-global-chat]
    paths: ['.github/workflows/import-site-help-final.yml']
permissions:
  contents: write
jobs:
  publish-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-help-global-chat
          fetch-depth: 0
      - name: Import verified Git bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://temporary-snappy-tungsten-nov7h3x.vercel.app/feature.bundle' -o /tmp/feature.bundle
          git bundle verify /tmp/feature.bundle
          git fetch /tmp/feature.bundle HEAD:refs/remotes/bundle/final
          test "$(git rev-parse refs/remotes/bundle/final)" = '6d738cc56c5f68af62cc0b203902f1363404cc03'
          git switch -C feature/site-help-global-chat-final refs/remotes/bundle/final
          git push origin HEAD:refs/heads/feature/site-help-global-chat-final
