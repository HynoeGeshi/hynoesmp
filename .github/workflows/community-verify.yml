name: Hynoe community verification

on:
  push:
    branches:
      - feature/hynoe-community-20261006-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node tests
        run: node --test tests/*.test.mjs

  browser-tests:
    needs: node-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/hynoe-http.log 2>&1 &
          echo $! > /tmp/hynoe-http.pid
          sleep 1
      - name: Verify Hynoe Community in Chromium
        run: COMMUNITY_ENGINE=chromium node tests/browser-community.mjs
      - name: Verify Hynoe Community in WebKit
        run: COMMUNITY_ENGINE=webkit node tests/browser-community.mjs
      - name: Verify existing mobile Outpost
        run: node tests/browser-mobile.mjs
      - name: Verify first-load mobile Outpost
        run: node tests/browser-first-load.mjs
      - name: Verify restored-save mobile Outpost
        run: RESTORED_RUN_ENGINE=chromium node tests/browser-restored-run.mjs
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: community-browser-failures
          path: test-artifacts
          if-no-files-found: ignore
