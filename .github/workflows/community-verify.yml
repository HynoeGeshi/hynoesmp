name: Hynoe community verification

on:
  push:
    branches:
      - feature/hynoe-community-20261006-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node tests
        run: node --test tests/*.test.mjs
