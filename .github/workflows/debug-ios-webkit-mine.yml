name: Debug iOS WebKit mine

on:
  push:
    branches:
      - debug/ios-webkit-mine-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps webkit
      - name: Probe live iPhone-like load in WebKit
        run: |
          cat > tests/debug-webkit-probe.mjs <<'EOF'
          import {webkit} from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('test-artifacts',{recursive:true});
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGEERROR '+e.stack));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text());});
          await page.goto('https://hynoesmp.com/watch.html?webkit='+Date.now(),{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(2200);
          const state=await page.evaluate(()=>{
            const b=document.querySelector('#vein-0');
            const face=b?.querySelector('.gem-face');
            const strong=b?.querySelector('strong');
            const small=b?.querySelector('small');
            const fill=b?.querySelector('.vein-health i');
            return {
              href:location.href,
              veinCount:document.querySelectorAll('.vein').length,
              oreText:document.querySelector('#ore')?.textContent,
              strongText:strong?.textContent,
              smallText:small?.textContent,
              oreVar:b?.style.getPropertyValue('--ore'),
              faceFill:face?getComputedStyle(face).fill:null,
              fillWidth:fill?.style.width,
              strongDisplay:strong?getComputedStyle(strong).display:null,
              strongColor:strong?getComputedStyle(strong).color:null,
              smallDisplay:small?getComputedStyle(small).display:null,
              smallColor:small?getComputedStyle(small).color:null,
              readyState:document.readyState
            };
          });
          const report='WEBKIT_STATE '+JSON.stringify(state)+'\nWEBKIT_ERRORS '+JSON.stringify(errors)+'\n';
          console.log(report);
          fs.writeFileSync('test-artifacts/webkit-probe.txt',report);
          await page.locator('#vein-0').scrollIntoViewIfNeeded().catch(()=>{});
          await page.screenshot({path:'test-artifacts/webkit-watch.png',fullPage:false});
          if(state.veinCount!==12) throw new Error('Expected 12 veins');
          if(!state.strongText||!state.smallText||!state.oreVar||!state.fillWidth) throw new Error('Mine initialized incompletely: '+JSON.stringify(state));
          const before=Number((await page.locator('#ore').textContent())||0);
          await page.locator('#vein-0').tap();
          await page.waitForTimeout(150);
          const after=Number((await page.locator('#ore').textContent())||0);
          if(!(after>before)) throw new Error('Tap failed '+before+' -> '+after);
          if(errors.some(e=>e.startsWith('PAGEERROR'))) throw new Error(errors.join('\n'));
          await browser.close();
          EOF
          node tests/debug-webkit-probe.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-webkit-mine-debug
          path: test-artifacts/*
          if-no-files-found: ignore
