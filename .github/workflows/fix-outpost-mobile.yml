name: Fix Hynoe Outpost mobile

on:
  push:
    branches:
      - hynoe-outpost-overhaul-2026-10-05
    paths:
      - '.github/workflows/fix-outpost-mobile.yml'
      - '.github/scripts/fix-outpost-mobile.py'
      - 'tests/mobile-outpost.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message || '', '[outpost-mobile-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm mobile regression
        run: |
          if node --test tests/mobile-outpost.test.mjs; then
            echo "Mobile regression unexpectedly already passes."
            exit 1
          else
            echo "Confirmed: mobile layer/rebrand/save migration still need repair."
          fi
      - name: Apply mobile repair
        run: python .github/scripts/fix-outpost-mobile.py
      - name: Verify mobile repair and full game suite
        run: |
          node --check assets/watch.mjs
          node --check assets/watch-mobile.mjs
          node --test tests/mobile-outpost.test.mjs
          node --test tests/*.test.mjs
      - name: Commit repair to overhaul branch
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.html index.html assets/watch.mjs assets/watch-mobile.css assets/watch-mobile.mjs
          git commit -m "fix: repair Hynoe Outpost mobile mining [outpost-mobile-fixed]"
          git push origin HEAD:hynoe-outpost-overhaul-2026-10-05
