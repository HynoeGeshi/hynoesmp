name: Fix homepage scene asset paths

on:
  push:
    branches:
      - hynoe-outpost-overhaul-2026-10-05
    paths:
      - '.github/workflows/fix-home-scene-paths.yml'
      - '.github/scripts/fix-home-scene-paths.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message || '', '[scene-paths-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair scene image paths
        run: python .github/scripts/fix-home-scene-paths.py
      - name: Verify full suite
        run: node --test tests/*.test.mjs
      - name: Commit repaired paths
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: repair homepage scene image paths [scene-paths-fixed]"
          git push origin HEAD:hynoe-outpost-overhaul-2026-10-05
