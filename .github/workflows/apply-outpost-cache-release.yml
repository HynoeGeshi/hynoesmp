name: Apply Outpost cache release

on:
  push:
    branches:
      - fix/outpost-cache-release-20261006

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outpost-cache-release-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize Outpost asset release token
        run: |
          python - <<'PY'
          from pathlib import Path
          token = '20261006a'
          replacements = {
              Path('watch.html'): {
                  'assets/watch.css?v=20261005c': f'assets/watch.css?v={token}',
                  'assets/watch-mobile.css?v=20261005a': f'assets/watch-mobile.css?v={token}',
                  'assets/watch.mjs?v=20261005d': f'assets/watch.mjs?v={token}',
                  'assets/watch-mobile.mjs?v=20261005a': f'assets/watch-mobile.mjs?v={token}',
              },
              Path('assets/watch.mjs'): {
                  './watch-command.mjs?v=20261005a': f'./watch-command.mjs?v={token}',
                  './watch-game.mjs?v=20261005a': f'./watch-game.mjs?v={token}',
                  './watch-session.mjs?v=20261005a': f'./watch-session.mjs?v={token}',
              },
              Path('assets/watch-mobile.mjs'): {
                  './save-recovery.mjs?v=20261005a': f'./save-recovery.mjs?v={token}',
              },
              Path('assets/watch-game.mjs'): {
                  './watch-progression.mjs?v=20261005a': f'./watch-progression.mjs?v={token}',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'Missing expected reference {old} in {path}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Verify syntax and regression suite
        run: |
          node --check assets/watch.mjs
          node --check assets/watch-mobile.mjs
          node --check assets/watch-game.mjs
          node --test tests/*.test.mjs
      - name: Commit verified cache release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.html assets/watch.mjs assets/watch-mobile.mjs assets/watch-game.mjs
          git rm .github/workflows/apply-outpost-cache-release.yml
          git commit -m "fix: force fresh Hynoe Outpost asset release"
          git push origin HEAD:fix/outpost-cache-release-20261006
