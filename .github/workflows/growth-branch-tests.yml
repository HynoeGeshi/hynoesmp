name: Growth branch tests

on:
  push:
    branches:
      - growth-machine-2026-10-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full Node test suite
        run: node --test tests/*.test.mjs
