name: Update Hynoe YouTube Broadcast

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions: {}

concurrency:
  group: hynoe-youtube-broadcast
  cancel-in-progress: true

jobs:
  update-stream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      source_sha: ${{ steps.commit.outputs.source_sha }}

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify broadcast updater
        run: python -m unittest discover -s tests -p '*_youtube.py'

      - name: Find latest Hynoe livestream
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: python scripts/update_youtube.py

      - name: Commit broadcast change
        id: commit
        shell: bash
        run: |
          changed=false
          if git diff --quiet -- data/stream.json; then
            echo "No stream change."
          else
            git config user.name "hynoe-broadcast-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/stream.json
            git commit -m "Update Hynoe broadcast"
            git push
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-stream:
    needs: update-stream
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out the refreshed feed
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-stream.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish broadcast data to GitHub Pages
        env:
          BROADCAST_CHANGED: ${{ needs.update-stream.outputs.changed }}
          BROADCAST_SOURCE_SHA: ${{ needs.update-stream.outputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_youtube.py
