name: Diagnose Public YouTube Iframe Playback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hynoe-youtube-iframe-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-iframe-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up existing browser test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright in temporary directory
        run: npm install --prefix "$RUNNER_TEMP/hynoe-iframe-probe" --no-save --no-package-lock --ignore-scripts playwright@1.63.0
      - name: Probe one public video in installed Chrome
        env:
          NODE_PATH: ${{ runner.temp }}/hynoe-iframe-probe/node_modules
        run: node scripts/probe_youtube_iframe.cjs
      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hynoe-public-iframe-diagnostic
          path: |
            test-artifacts/iframe-probe.json
            test-artifacts/iframe-probe-failure.png
          if-no-files-found: ignore
          retention-days: 1
