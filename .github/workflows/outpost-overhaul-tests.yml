name: Hynoe site regression tests

on:
  push:
    branches:
      - main
      - hynoe-outpost-overhaul-2026-10-05
      - fix/youtube-stream-title-fallback
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check game modules
        run: |
          node --check assets/watch.mjs
          if [ -f assets/watch-mobile.mjs ]; then node --check assets/watch-mobile.mjs; fi
      - name: Run full Node test suite
        run: node --test tests/*.test.mjs
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
