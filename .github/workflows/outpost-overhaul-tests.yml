name: Hynoe Outpost overhaul tests

on:
  push:
    branches:
      - hynoe-outpost-overhaul-2026-10-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game modules
        run: |
          node --check assets/watch.mjs
          if [ -f assets/watch-mobile.mjs ]; then node --check assets/watch-mobile.mjs; fi
      - name: Run full Node test suite
        run: node --test tests/*.test.mjs
