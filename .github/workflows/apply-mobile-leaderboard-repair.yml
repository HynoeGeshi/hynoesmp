name: Apply mobile leaderboard repair

on:
  push:
    branches:
      - fix-mobile-leaderboard-2026-10-05

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-mobile-leaderboard-2026-10-05
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repair patch
        run: python scripts/repair-mobile-leaderboard.py
      - name: Verify modules and regression suite
        run: |
          node --check assets/leaderboard-live.mjs
          node --check assets/watch.mjs
          node --check assets/watch-mobile.mjs
          node --test tests/*.test.mjs
      - name: Commit repaired production files
        run: |
          rm .github/workflows/apply-mobile-leaderboard-repair.yml scripts/repair-mobile-leaderboard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore mobile mining art and live Hall of Legends"
          git push origin HEAD:fix-mobile-leaderboard-2026-10-05
