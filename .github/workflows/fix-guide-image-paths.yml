name: Fix guide image paths

on:
  push:
    branches:
      - fix/mobile-sitewide-refresh-20261006
    paths:
      - '.github/workflows/fix-guide-image-paths.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-sitewide-refresh-20261006
      - name: Normalize CSS-variable image URLs in public HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed=[]
          for path in Path('.').glob('*.html'):
            text=path.read_text(encoding='utf-8')
            fixed=re.sub(r"(--(?:hero|scene):url\(['\"]?)assets/images/",r"\1images/",text)
            if fixed!=text:
              path.write_text(fixed,encoding='utf-8')
              changed.append(path.name)
          print('normalized:', ', '.join(changed) or 'none')
          PY
      - name: Verify no doubled guide-image sources remain
        run: |
          if grep -R -n -E -- "--(hero|scene):url\(['\"]?assets/images/" -- *.html; then
            echo 'stale CSS-variable image paths remain'
            exit 1
          fi
      - name: Commit guide image repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair guide hero image paths"
          git push origin HEAD:fix/mobile-sitewide-refresh-20261006
