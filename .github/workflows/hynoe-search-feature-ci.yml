name: Hynoe Search Feature CI

on:
  push:
    branches:
      - hynoe-search-visual-retention
    paths:
      - hynoe-search-app/**
      - .github/workflows/hynoe-search-feature-ci.yml

jobs:
  unit-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hynoe-search-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hynoe-search-app/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  public-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hynoe-search-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hynoe-search-app/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build app for browser tests
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public browser tests
        run: npx playwright test e2e/home.spec.ts e2e/search.spec.ts e2e/page.spec.ts --project=desktop --project=mobile
