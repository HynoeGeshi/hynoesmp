name: Hynoe Search Feature CI

on:
  push:
    branches:
      - hynoe-search-visual-retention
    paths:
      - hynoe-search-app/**
      - .github/workflows/hynoe-search-feature-ci.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hynoe-search-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hynoe-search-app/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
