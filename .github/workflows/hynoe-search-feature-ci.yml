name: Hynoe Search Feature CI

on:
  pull_request:
    branches:
      - hynoe-search-phase2a
    paths:
      - hynoe-search-app/**
      - .github/workflows/hynoe-search-feature-ci.yml
  push:
    branches:
      - hynoe-search-visual-retention
    paths:
      - hynoe-search-app/**
      - .github/workflows/hynoe-search-feature-ci.yml

permissions:
  contents: read

jobs:
  unit-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hynoe-search-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hynoe-search-app/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Domain and host-routing tests
        run: npm run test:domain
      - name: Build
        run: npm run build

  public-browser:
    needs: unit-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hynoe-search-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hynoe-search-app/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build app for browser tests
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public browser tests
        run: npx playwright test e2e/home.spec.ts e2e/search.spec.ts e2e/page.spec.ts e2e/retention.spec.ts --project=desktop --project=mobile

  lockfile:
    needs: [unit-build, public-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm lockfile is current
        working-directory: hynoe-search-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code -- package-lock.json
