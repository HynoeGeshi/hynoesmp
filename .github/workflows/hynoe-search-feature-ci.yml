name: Hynoe Search Feature CI

on:
  push:
    branches:
      - hynoe-search-visual-retention
    paths:
      - hynoe-search-app/**
      - .github/workflows/hynoe-search-feature-ci.yml

permissions:
  contents: write

jobs:
  unit-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hynoe-search-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hynoe-search-app/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Domain and host-routing tests
        run: npm run test:domain
      - name: Build
        run: npm run build

  public-browser:
    needs: unit-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hynoe-search-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hynoe-search-app/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build app for browser tests
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public browser tests
        run: npx playwright test e2e/home.spec.ts e2e/search.spec.ts e2e/page.spec.ts e2e/retention.spec.ts --project=desktop --project=mobile

  lockfile:
    needs: [unit-build, public-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hynoe-search-visual-retention
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact npm lockfile
        working-directory: hynoe-search-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when it changes
        run: |
          if git diff --quiet -- hynoe-search-app/package-lock.json && git ls-files --error-unmatch hynoe-search-app/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hynoe-search-app/package-lock.json
          git commit -m "chore: lock Hynoe Search dependencies"
          git push origin HEAD:hynoe-search-visual-retention
