name: Validate Hynoe Control Bridge

on:
  push:
    branches:
      - feature/hynoe-control-bridge

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-bridge
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: control-bridge/package-lock.json

      - name: Install dependencies with bundled npm 10.9.9
        run: |
          test "$(npm --version)" = '10.9.9'
          npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build for production
        run: npm run build
