name: Hynoe Search Phase 2A Lockfile

on:
  push:
    branches:
      - hynoe-search-phase-2a
    paths:
      - hynoe-search-app/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hynoe-search-phase-2a
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hynoe-search-app/package-lock.json
      - name: Refresh exact lockfile
        working-directory: hynoe-search-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- hynoe-search-app/package-lock.json; then
            exit 0
          fi
          git config user.name "Hynoe CI"
          git config user.email "actions@users.noreply.github.com"
          git add hynoe-search-app/package-lock.json
          git commit -m "build: refresh Phase 2A lockfile"
          git push origin HEAD:hynoe-search-phase-2a
