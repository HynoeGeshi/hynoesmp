name: Hynoe preview directory verification
on:
  push:
    branches: [feature/hynoe-preview-directory-2027, hynoe-search-phase2a-impl]
    paths:
      - 'hynoe-search-app/**'
      - '.github/workflows/hynoe-preview-2027.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hynoe-preview-2027-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hynoe-search-app
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hynoe-search-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Listing, CSP and authorization regression tests
        run: node --experimental-strip-types --test verification/preview-2027.check.mjs
      - name: Existing application regression suite
        run: npm test && npm run test:domain
      - name: Production build and type validation
        run: npm run build
      - name: Install Chromium for local browser verification
        run: npx playwright install --with-deps chromium
      - name: Browser, navigation and responsive checks
        run: npx playwright test --config=playwright.preview.config.ts
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hynoe-preview-2027-evidence
          path: |
            hynoe-search-app/preview-test-report
            hynoe-search-app/preview-test-results
          retention-days: 7
          if-no-files-found: ignore
