name: Fix cave runs

on:
  push:
    paths:
      - '.github/workflows/fix-cave-runs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message || '', '[cave-runs-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cave-run UX and tests
        shell: python
        run: |
          from pathlib import Path

          ui_path = Path('assets/watch.mjs')
          ui = ui_path.read_text()

          if 'function caveBlockers(index)' not in ui:
              anchor = "function leaderboardPayload()"
              helper = """function caveBlockers(index){const c=G.SECTORS[index],p=state.progress,fee=100*(index+1)**2,blockers=[];if(!c||!Number.isInteger(index))blockers.push('unknown cave route');else if(p.chapter<c.chapter)blockers.push('complete chapter '+c.chapter);if(p.run)blockers.push('finish or extract from the active cave run');if(state.expedition)blockers.push('finish the active relic hunt');if(c&&state.ore<fee)blockers.push(fmt(Math.ceil(fee-state.ore))+' more ore');return {c,fee,blockers,ready:!!c&&!blockers.length};}\n"""
              if anchor not in ui:
                  raise SystemExit('Could not find helper insertion point')
              ui = ui.replace(anchor, helper + anchor, 1)

          old_sector_click = "button.onclick=()=>{if(G.startSurvey(state,i)){save();render();$('cave-run').scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});toast('Cave run started: '+c.name+'.');}};sectorRows.set(i,{row,reward,button});"
          new_sector_click = "button.onclick=()=>{const gate=caveBlockers(i);if(!gate.ready){toast('Cave locked: '+(gate.blockers.join(' · ')||'requirements not met')+'.');return;}if(G.startSurvey(state,i)){save();render();$('cave-run').scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});toast('Cave run started: '+c.name+'.');}else toast('Cave could not start. Recheck your run status and entry cost.');};sectorRows.set(i,{row,reward,button});"
          if old_sector_click in ui:
              ui = ui.replace(old_sector_click, new_sector_click, 1)
          elif "Cave locked:" not in ui:
              raise SystemExit('Could not find cave entry click handler')

          old_sector_render = "for(const [i,c] of G.SECTORS.entries()){const v=sectorRows.get(i),locked=p.chapter<c.chapter;v.row.classList.toggle('locked',locked);v.reward.textContent='Base '+Math.floor((12+i*8)*G.supplyBonus(p))+' '+c.material+' + discoveries · '+(2+i*2)+' Insight';v.button.textContent=locked?'Complete chapter '+c.chapter:p.run?'Run active':'Enter cave · '+fmt(100*(i+1)**2)+' ore';v.button.disabled=locked||!!p.run||!!state.expedition||state.ore<100*(i+1)**2;}"
          new_sector_render = "for(const [i,c] of G.SECTORS.entries()){const v=sectorRows.get(i),locked=p.chapter<c.chapter,gate=caveBlockers(i),hardLocked=!!p.run||!!state.expedition;v.row.classList.toggle('locked',locked);v.reward.textContent='Base '+Math.floor((12+i*8)*G.supplyBonus(p))+' '+c.material+' + discoveries · '+(2+i*2)+' Insight';v.button.disabled=hardLocked;v.button.setAttribute('aria-disabled',String(!gate.ready));v.button.classList.toggle('locked',!gate.ready);v.button.dataset.ready=String(gate.ready);v.button.textContent=gate.ready?'ENTER CAVE · '+fmt(gate.fee)+' ORE':'LOCKED · '+(gate.blockers[0]||'requirements not met').toUpperCase();v.button.title=gate.ready?'Ready to enter':gate.blockers.join(' · ');}"
          if old_sector_render in ui:
              ui = ui.replace(old_sector_render, new_sector_render, 1)
          elif "v.button.dataset.ready=String(gate.ready)" not in ui:
              raise SystemExit('Could not find cave sector render block')

          old_run_status = "$('survey-status').textContent=run.last+(run.ready?'':' Next: '+forecast.hazard+' ('+forecast.role+' counters). Scout: '+forecast.min+'–'+forecast.max+' damage. Mine: '+mine.min+'–'+mine.max+' damage.');$('run-guard').disabled=run.ready||!run.rations||run.hp>=100;$('run-guard').textContent='Fortify · '+(run.rations||0)+' rations';"
          new_run_status = "$('survey-status').textContent=run.last+(run.ready?'':' NEXT HAZARD: '+forecast.hazard.toUpperCase()+' · '+forecast.role+' counters it. Choose safer progress or a bigger haul.');$('run-scout').disabled=run.ready;$('run-mine').disabled=run.ready;$('run-scout').querySelector('small').textContent='Safer · '+forecast.min+'–'+forecast.max+' damage · steady haul';$('run-mine').querySelector('small').textContent='Bigger haul · '+mine.min+'–'+mine.max+' damage';$('run-guard').disabled=run.ready||!run.rations||run.hp>=100;$('run-guard').textContent='Fortify · '+(run.rations||0)+' rations';$('run-guard').querySelector('small').textContent=run.hp>=100?'Take damage first':'Recover health before the next crossing';"
          if old_run_status in ui:
              ui = ui.replace(old_run_status, new_run_status, 1)
          elif "NEXT HAZARD:" not in ui:
              raise SystemExit('Could not find cave run status block')

          old_play = "function playRun(action){const result=G.advanceSurvey(state,action);if(!result)return;if(result.retreated){toast('Crew extracted with '+result.amount+' '+result.material+'.');}else if(result.failed){toast('The cave run failed. Upgrade, regroup, and try again.');}else if(result.ready){toast('Final cache found! Open it now.');}else if(result.healed){toast('Crew recovered '+result.healed+' health.');}save();render();}"
          new_play = "function playRun(action){const result=G.advanceSurvey(state,action);if(!result){toast(action==='guard'?'Fortify needs missing health and at least 1 ration.':'That cave action is not available right now.');return;}if(result.retreated){toast('Crew extracted with '+result.amount+' '+result.material+'.');}else if(result.failed){toast('The cave run failed. Upgrade, regroup, and try again.');}else if(result.ready){toast('Final cache found! Open it now.');}else if(result.healed){toast('Crew recovered '+result.healed+' health.');}else toast('Crossing cleared. Recheck the next hazard before choosing.');save();render();}"
          if old_play in ui:
              ui = ui.replace(old_play, new_play, 1)
          elif "Crossing cleared. Recheck the next hazard" not in ui:
              raise SystemExit('Could not find cave action handler')

          ui_path.write_text(ui)

          html_path = Path('watch.html')
          html = html_path.read_text().replace('assets/watch.mjs?v=20261005b','assets/watch.mjs?v=20261005c')
          html_path.write_text(html)

          test_path = Path('tests/game.test.mjs')
          tests = test_path.read_text()
          engine_marker = "test('cave runs start persist finish and pay once'"
          if engine_marker not in tests:
              tests += "\n" + "test('cave runs start persist finish and pay once',()=>{let s=G.fresh(1000);assert.equal(G.startSurvey(s,0),false);s.ore=1000;s.total=1000;assert.equal(G.startSurvey(s,0),true);assert.equal(s.ore,900);assert.equal(G.startSurvey(s,0),false);const first=G.advanceSurvey(s,'scout',()=>0);assert.ok(first);assert.equal(s.progress.run.room,2);s=G.restore(JSON.stringify(s),1000);assert.equal(s.progress.run.room,2);assert.ok(G.surveyForecast(s,'scout'));assert.ok(G.advanceSurvey(s,'scout',()=>0));const final=G.advanceSurvey(s,'scout',()=>0);assert.equal(final.ready,true);const before=s.progress.surveys,reward=G.collectSurvey(s);assert.ok(reward.amount>0);assert.equal(s.progress.surveys,before+1);assert.equal(G.collectSurvey(s),false);});" + "\n"
          ui_marker = "test('cave UI explains locks and live risk'"
          if ui_marker not in tests:
              tests += "test('cave UI explains locks and live risk',()=>{const ui=readFileSync(new URL('../assets/watch.mjs',import.meta.url),'utf8');assert.match(ui,/function caveBlockers\\(index\\)/);assert.match(ui,/Cave locked:/);assert.match(ui,/NEXT HAZARD:/);assert.match(ui,/v\\.button\\.dataset\\.ready=String\\(gate\\.ready\\)/);assert.doesNotMatch(ui,/v\\.button\\.disabled=locked\\|\\|!!p\\.run/);});\n"
          test_path.write_text(tests)

      - name: Run game tests
        run: node --test tests/game.test.mjs tests/mini-player.test.mjs

      - name: Commit cave-run repair
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/watch.mjs watch.html tests/game.test.mjs
          git commit -m "Fix cave run feedback and risk UI [cave-runs-fixed]"
          git push origin HEAD:main
