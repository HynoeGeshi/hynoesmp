name: Apply mobile sitewide refresh

on:
  push:
    branches:
      - fix/mobile-sitewide-refresh-20261006
    paths:
      - '.github/workflows/apply-mobile-sitewide-refresh.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-sitewide-refresh-20261006
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire shared refresh, on-site stream, and fresh Outpost release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
            'index.html','start.html','mca.html','progression.html','economy.html','bosses.html','join.html',
            'modpack.html','updates.html','modded-minecraft-server.html','watch.html',
            'privacy.html','terms.html','data-deletion.html','community-rules.html',
          ]
          shared = '<link rel="stylesheet" href="assets/site-refresh.css?v=20261006b">'

          for name in pages:
            path = Path(name)
            text = path.read_text(encoding='utf-8')
            extras = []
            if shared not in text:
              extras.append(shared)
            if name == 'watch.html':
              text = text.replace('assets/watch.css?v=20261006a','assets/watch.css?v=20261006b')
              text = text.replace('assets/watch-mobile.css?v=20261006a','assets/watch-mobile.css?v=20261006b')
              text = text.replace('assets/watch.mjs?v=20261006a','assets/watch.mjs?v=20261006b')
              text = text.replace('assets/watch-mobile.mjs?v=20261006a','assets/watch-mobile.mjs?v=20261006b')
              if 'assets/watch-mobile-v2.css?v=20261006b' not in text:
                extras.append('<link rel="stylesheet" href="assets/watch-mobile-v2.css?v=20261006b">')
              if 'assets/watch-video.mjs?v=20261006b' not in text:
                extras.append('<script type="module" src="assets/watch-video.mjs?v=20261006b"></script>')
              text = re.sub(
                r'<div class="video" id="video">.*?</div><div class="video-footer">',
                '<div class="video" id="video"><button type="button" class="play-broadcast">▶ Play latest stream here</button></div><div class="video-footer">',
                text,
                count=1,
                flags=re.S,
              )
              text = text.replace('>Watch on YouTube ↗</a>','>OPEN ON YOUTUBE ↗</a>')
              text = text.replace('>Open Hynoe on YouTube ↗</a>','>OPEN ON YOUTUBE ↗</a>')
            elif name == 'index.html':
              text = re.sub(
                r'<a class="mc-button red" data-stream-watch[^>]*>.*?</a>',
                '<a class="mc-button red" data-stream-watch href="watch.html#video">WATCH HERE ON HYNOE</a>',
                text,
                count=1,
                flags=re.S,
              )
              text = re.sub(r'assets/stream\.js(?:\?v=[0-9a-z]+)?', 'assets/stream.js?v=20261006b', text)
            if extras:
              text = text.replace('</head>', '\n' + '\n'.join(extras) + '\n</head>', 1)
            path.write_text(text, encoding='utf-8')

          for name in ['assets/watch.mjs','assets/watch-game.mjs','assets/watch-mobile.mjs']:
            path = Path(name)
            text = path.read_text(encoding='utf-8').replace('20261006a','20261006b')
            path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/browser-mobile-verify.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "      - 'index.html'\n"
          text = text.replace(marker, "      - '*.html'\n" + marker)
          workflow.write_text(text, encoding='utf-8')

          for temporary in [
            '.github/workflows/mobile-refresh-red.yml',
            '.github/workflows/apply-mobile-sitewide-refresh.yml',
          ]:
            p = Path(temporary)
            if p.exists():
              p.unlink()
          PY
      - name: Verify production code and full regression suite
        run: |
          node --check assets/watch.mjs
          node --check assets/watch-mobile.mjs
          node --check assets/watch-video.mjs
          node --test tests/*.test.mjs
      - name: Commit verified refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair mobile Outpost and refresh all site pages"
          git push origin HEAD:fix/mobile-sitewide-refresh-20261006
