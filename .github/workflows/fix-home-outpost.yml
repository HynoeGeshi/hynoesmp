name: Fix Hynoe homepage overhaul

on:
  push:
    branches:
      - hynoe-outpost-overhaul-2026-10-05
    paths:
      - '.github/workflows/fix-home-outpost.yml'
      - '.github/scripts/fix-home-outpost.py'
      - '.github/scripts/run-home-outpost-fix.py'
      - 'tests/home-overhaul.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message || '', '[home-outpost-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm homepage regression
        run: |
          if node --test tests/home-overhaul.test.mjs; then
            echo "Homepage regression unexpectedly already passes."
            exit 1
          else
            echo "Confirmed: homepage overhaul contract is RED."
          fi
      - name: Apply homepage overhaul
        run: python .github/scripts/run-home-outpost-fix.py
      - name: Verify homepage and full suite
        run: |
          node --test tests/home-overhaul.test.mjs
          node --test tests/*.test.mjs
      - name: Commit homepage repair to overhaul branch
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/home-outpost.css
          git commit -m "feat: overhaul Hynoe SMP homepage [home-outpost-fixed]"
          git push origin HEAD:hynoe-outpost-overhaul-2026-10-05
