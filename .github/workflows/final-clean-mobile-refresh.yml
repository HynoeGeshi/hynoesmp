name: Final clean mobile refresh

on:
  push:
    branches:
      - fix/mobile-sitewide-refresh-20261006
    paths:
      - '.github/workflows/final-clean-mobile-refresh.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore normal CI and remove temporary artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/browser-mobile-verify.yml
          rm -rf node_modules test-artifacts
          rm -f .github/workflows/diagnose-mobile-merge.yml
          rm -f .github/workflows/resolve-mobile-merge.yml
          rm -f .github/workflows/final-clean-mobile-refresh.yml
      - name: Verify clean production tree
        run: |
          node --check assets/watch.mjs
          node --check assets/watch-mobile.mjs
          node --check assets/watch-video.mjs
          node --test tests/*.test.mjs
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hynoe-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/watch.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-mobile.mjs
      - name: Remove generated verification files
        run: |
          rm -rf node_modules test-artifacts
      - name: Commit clean branch
        run: |
          git add -A
          git commit -m 'chore: clean mobile refresh verification artifacts'
          git push origin HEAD:fix/mobile-sitewide-refresh-20261006
