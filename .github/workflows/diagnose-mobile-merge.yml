name: Diagnose mobile refresh merge

on:
  push:
    branches:
      - fix/mobile-sitewide-refresh-20261006
    paths:
      - '.github/workflows/diagnose-mobile-merge.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-sitewide-refresh-20261006
          fetch-depth: 0
      - name: Show conflicts with current main
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          code=$?
          echo "MERGE_EXIT=$code"
          echo "CONFLICTS_START"
          git diff --name-only --diff-filter=U
          echo "CONFLICTS_END"
          git status --short
          if [ -f .git/MERGE_HEAD ]; then git merge --abort; fi
          exit 0
