name: Apply mobile first-load blocker fix v2

on:
  push:
    branches:
      - fix/mobile-first-load-blocker-20261006
    paths:
      - '.github/workflows/apply-mobile-first-load-fix-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply both verified mobile root-cause fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('assets/watch.mjs')
          s=p.read_text()
          forced="""try{if(!localStorage.getItem('hynoeDeepDeeperGuideV3')){localStorage.setItem('hynoeDeepDeeperGuideV3','seen');setTimeout(()=>{if(!guide.open)guide.showModal();},450);}}catch{}"""
          if forced not in s: raise SystemExit('forced first-load guide block missing')
          p.write_text(s.replace(forced,''))

          p=Path('assets/site-refresh.css')
          s=p.read_text()
          old="""  body[data-page] .hotbar{\n    position:fixed;\n    z-index:999;\n    left:10px;"""
          new="""  body[data-page] .hotbar{\n    position:fixed;\n    z-index:999;\n    top:auto;\n    height:auto;\n    left:10px;"""
          if old not in s: raise SystemExit('mobile hotbar fixed rule missing')
          p.write_text(s.replace(old,new,1))

          pages=['index.html','start.html','mca.html','progression.html','economy.html','bosses.html','join.html','modpack.html','updates.html','modded-minecraft-server.html','watch.html','privacy.html','terms.html','data-deletion.html','community-rules.html']
          for name in pages:
              p=Path(name)
              p.write_text(p.read_text().replace('assets/site-refresh.css?v=20261006b','assets/site-refresh.css?v=20261006c'))

          for name in ['watch.html','assets/watch.mjs','assets/watch-mobile.mjs','assets/watch-game.mjs','tests/mobile-outpost.test.mjs']:
              p=Path(name)
              p.write_text(p.read_text().replace('20261006b','20261006c'))
          PY
      - name: Align regression contracts to the repaired behavior
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/game.test.mjs')
          s=p.read_text()
          old="assert.match(ui,/hynoeDeepDeeperGuideV3/);"
          if old not in s: raise SystemExit('legacy auto-guide expectation missing')
          p.write_text(s.replace(old,"assert.doesNotMatch(ui,/hynoeDeepDeeperGuideV3/);"))

          for name in ['tests/live-mobile-leaderboard-repair.test.mjs','tests/sitewide-mobile-refresh.test.mjs']:
              p=Path(name)
              p.write_text(p.read_text().replace('20261006b','20261006c'))
          PY
      - name: Strengthen fresh-load physical tap and homepage coverage test
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/browser-first-load.mjs')
          s=p.read_text()
          tap_old="""    assert.ok(after>before,`${label}: first physical tap did not register (${before} -> ${after})`);\n\n    await page.locator('#open-help').click();"""
          tap_new="""    assert.ok(after>before,`${label}: first physical tap did not register (${before} -> ${after})`);\n\n    const repeatedBefore=after;\n    for(let i=0;i<20;i++){\n      await vein.tap({timeout:3000});\n      await page.waitForTimeout(18);\n    }\n    await page.waitForTimeout(150);\n    const repeatedAfter=Number((await page.locator('#ore').textContent())||0);\n    assert.ok(repeatedAfter>=repeatedBefore+20,`${label}: repeated physical taps were lost or blocked (${repeatedBefore} -> ${repeatedAfter})`);\n\n    await page.locator('#open-help').click();"""
          if tap_old not in s: raise SystemExit('fresh-load tap insertion point missing')
          s=s.replace(tap_old,tap_new)

          home_old="""    const home=await page.evaluate(()=>{\n      const covers=[...document.querySelectorAll('body *')].filter(el=>{\n        const r=el.getBoundingClientRect(),s=getComputedStyle(el);\n        return (s.position==='fixed'||s.position==='sticky')&&s.pointerEvents!=='none'&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>=innerWidth*.9&&r.height>=innerHeight*.7;\n      });\n      return {covers:covers.map(el=>el.id||String(el.className)||el.tagName),scrollWidth:document.documentElement.scrollWidth,innerWidth};\n    });\n    assert.deepEqual(home.covers,[],`${label}: homepage has a viewport-covering fixed/sticky layer: ${home.covers.join(', ')}`);\n    assert.ok(home.scrollWidth<=home.innerWidth+1,`${label}: homepage horizontal overflow ${home.scrollWidth} > ${home.innerWidth}`);"""
          home_new="""    const home=await page.evaluate(()=>{\n      const hotbar=document.querySelector('.hotbar');\n      const hr=hotbar?.getBoundingClientRect();\n      const covers=[...document.querySelectorAll('body *')].filter(el=>{\n        const r=el.getBoundingClientRect(),s=getComputedStyle(el);\n        const intersects=r.right>0&&r.left<innerWidth&&r.bottom>0&&r.top<innerHeight;\n        return intersects&&(s.position==='fixed'||s.position==='sticky')&&s.pointerEvents!=='none'&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>=innerWidth*.9&&r.height>=innerHeight*.7;\n      });\n      return {hotbar:hr?hr.toJSON():null,covers:covers.map(el=>el.id||String(el.className)||el.tagName),scrollWidth:document.documentElement.scrollWidth,innerWidth,innerHeight};\n    });\n    assert.ok(home.hotbar,`${label}: homepage hotbar missing`);\n    assert.ok(home.hotbar.height<=96,`${label}: mobile hotbar stretched to ${home.hotbar.height}px`);\n    assert.ok(home.hotbar.top>=0&&home.hotbar.bottom<=home.innerHeight+1,`${label}: mobile hotbar is outside viewport`);\n    assert.deepEqual(home.covers,[],`${label}: homepage has a viewport-covering fixed/sticky layer: ${home.covers.join(', ')}`);\n    assert.ok(home.scrollWidth<=home.innerWidth+1,`${label}: homepage horizontal overflow ${home.scrollWidth} > ${home.innerWidth}`);"""
          if home_old not in s: raise SystemExit('homepage coverage insertion point missing')
          p.write_text(s.replace(home_old,home_new))
          PY
      - name: Verify full Node suite
        run: |
          node --check assets/watch.mjs
          node --check assets/watch-mobile.mjs
          node --check assets/watch-video.mjs
          node --test tests/*.test.mjs
      - name: Verify full Chromium mobile matrix
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hynoe-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/watch.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-mobile.mjs
          node tests/browser-first-load.mjs
      - name: Clean temporary verification files
        run: |
          rm -f .github/workflows/apply-mobile-first-load-fix.yml
          rm -f .github/workflows/apply-mobile-first-load-fix-v2.yml
          rm -rf node_modules test-artifacts package-lock.json
      - name: Commit only verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair first-load mobile Outpost and homepage nav'
          git push origin HEAD:fix/mobile-first-load-blocker-20261006
