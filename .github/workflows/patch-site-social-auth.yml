name: Patch optional Turnstile guest auth

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-help-global-chat-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply branch patch
        run: python scripts/patch_optional_turnstile.py
      - name: Verify full suite
        run: |
          npm ci
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit verified patch
        run: |
          git config user.name "Hynoe Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/site-social.mjs assets/site-social-panel.mjs
          git commit -m "feat: make Turnstile optional for guest auth"
          git push origin HEAD:feature/site-help-global-chat-final
