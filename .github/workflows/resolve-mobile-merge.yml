name: Resolve mobile refresh merge

on:
  push:
    branches:
      - fix/mobile-sitewide-refresh-20261006
    paths:
      - '.github/workflows/resolve-mobile-merge.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-sitewide-refresh-20261006
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current main and resolve the three known conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' assets/watch.mjs tests/browser-mobile.mjs watch.html | sort)"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflicts:"
              echo "$conflicts"
              exit 1
            fi
          fi
          git checkout --theirs -- assets/watch.mjs tests/browser-mobile.mjs watch.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Keep the new live-leaderboard Watch page from main, then layer the mobile/sitewide/video repairs on top.
          watch=Path('watch.html')
          text=watch.read_text(encoding='utf-8')
          extras=[]
          for asset in [
            '<link rel="stylesheet" href="assets/site-refresh.css?v=20261006b">',
            '<link rel="stylesheet" href="assets/watch-mobile-v2.css?v=20261006b">',
            '<script type="module" src="assets/watch-video.mjs?v=20261006b"></script>',
          ]:
            if asset not in text:
              extras.append(asset)
          if extras:
            text=text.replace('</head>',''.join(extras)+'</head>',1)
          text=re.sub(
            r'<div class="video" id="video">.*?</div><div class="video-footer">',
            '<div class="video" id="video"><button type="button" class="play-broadcast">▶ Play latest stream here</button></div><div class="video-footer">',
            text,
            count=1,
            flags=re.S,
          )
          text=text.replace('>Watch on YouTube ↗</a>','>OPEN ON YOUTUBE ↗</a>')
          text=text.replace('>Open Hynoe on YouTube ↗</a>','>OPEN ON YOUTUBE ↗</a>')
          watch.write_text(text,encoding='utf-8')

          # Keep the latest leaderboard browser checks from main and expand them with the mobile/sitewide regressions.
          test=Path('tests/browser-mobile.mjs')
          js=test.read_text(encoding='utf-8')
          if 'const publicPages=[' not in js:
            marker="const extraViewports=[{width:768,height:1024},{width:1024,height:768},{width:844,height:390}];\n"
            public="const publicPages=[\n  'index.html','start.html','mca.html','progression.html','economy.html','bosses.html','join.html',\n  'modpack.html','updates.html','modded-minecraft-server.html','watch.html',\n  'privacy.html','terms.html','data-deletion.html','community-rules.html',\n];\n"
            js=js.replace(marker,marker+public,1)
          js=js.replace(
            "page.on('response',response=>{if(response.status()>=400)errors.push(`${label} HTTP ${response.status()}: ${response.url()}`);});",
            "page.on('response',response=>{if(response.status()>=400&&response.url().startsWith(base))errors.push(`${label} HTTP ${response.status()}: ${response.url()}`);});",
            1,
          )
          if 'async function assertVeinsFullyVisible' not in js:
            helper=r'''
async function assertVeinsFullyVisible(page,label){
  const result=await page.evaluate(()=>{
    const scene=document.querySelector('.mine-scene.mine-v2');
    const sceneBox=scene?.getBoundingClientRect();
    const cards=[...document.querySelectorAll('.vein')].map(card=>{
      const box=card.getBoundingClientRect();
      const strong=card.querySelector('strong');
      const small=card.querySelector('small');
      const strongBox=strong?.getBoundingClientRect();
      const smallBox=small?.getBoundingClientRect();
      const strongStyle=strong?getComputedStyle(strong):null;
      const smallStyle=small?getComputedStyle(small):null;
      return {
        bottom:box.bottom,left:box.left,right:box.right,
        strong:strong?.textContent?.trim()||'',small:small?.textContent?.trim()||'',
        strongHeight:strongBox?.height||0,smallHeight:smallBox?.height||0,
        strongVisible:!!strongStyle&&strongStyle.display!=='none'&&strongStyle.visibility!=='hidden'&&Number(strongStyle.opacity)>0,
        smallVisible:!!smallStyle&&smallStyle.display!=='none'&&smallStyle.visibility!=='hidden'&&Number(smallStyle.opacity)>0,
      };
    });
    return {scene:sceneBox?{bottom:sceneBox.bottom,left:sceneBox.left,right:sceneBox.right}:null,cards};
  });
  assert.ok(result.scene,`${label}: mine scene missing`);
  assert.equal(result.cards.length,12,`${label}: expected 12 mine cards`);
  for(const [index,card] of result.cards.entries()){
    assert.ok(card.bottom<=result.scene.bottom+1,`${label}: vein ${index} is clipped below the mine scene`);
    assert.ok(card.left>=result.scene.left-1&&card.right<=result.scene.right+1,`${label}: vein ${index} is clipped horizontally`);
    assert.ok(card.strong&&card.small,`${label}: vein ${index} missing label text`);
    assert.ok(card.strongVisible&&card.smallVisible&&card.strongHeight>0&&card.smallHeight>0,`${label}: vein ${index} label text is not visible`);
  }
}

'''
            js=js.replace('for(const viewport of [...phoneViewports,...extraViewports]){',helper+'for(const viewport of [...phoneViewports,...extraViewports]){',1)
          needle="  assert.ok(minVeinHeight>=88,`${label}: vein target only ${minVeinHeight}px tall`);\n"
          if 'await assertVeinsFullyVisible(page,label);' not in js:
            js=js.replace(needle,needle+'  await assertVeinsFullyVisible(page,label);\n',1)
          video=r'''
  if(viewport.width===390){
    const beforeUrl=page.url();
    const play=page.locator('#video .play-broadcast');
    assert.ok(await play.isVisible(),`${label}: on-site stream play button is missing`);
    await page.waitForFunction(()=>{const button=document.querySelector('#video .play-broadcast');return !!button&&!button.disabled;},null,{timeout:4000});
    await play.click();
    await page.waitForSelector('#video iframe',{timeout:4000});
    const frameSrc=await page.locator('#video iframe').getAttribute('src');
    assert.match(frameSrc||'',/youtube-nocookie\.com\/embed\//,`${label}: stream iframe is not privacy-enhanced YouTube embed`);
    assert.equal(new URL(page.url()).pathname,new URL(beforeUrl).pathname,`${label}: primary stream button navigated away from Hynoe`);
  }

'''
          if 'primary stream button navigated away from Hynoe' not in js:
            js=js.replace("  if(viewport.width===390||viewport.width===1024){\n    await page.screenshot({path:`test-artifacts/watch-${viewport.width}.png`,fullPage:true});",video+"  if(viewport.width===390||viewport.width===1024){\n    await page.screenshot({path:`test-artifacts/watch-${viewport.width}.png`,fullPage:true});",1)
          sitewide=r'''
for(const pageName of publicPages){
  const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true});
  const page=await context.newPage();
  const label=`sitewide ${pageName}`;
  const errors=captureErrors(page,label);
  await page.goto(`${base}/${pageName}`,{waitUntil:'domcontentloaded'});
  await page.waitForSelector('main');
  await page.waitForTimeout(150);
  await assertNoHorizontalOverflow(page,label);
  assert.equal(await page.locator('link[href*="site-refresh.css?v=20261006b"]').count(),1,`${label}: shared refresh stylesheet missing`);
  const content=await page.locator('main').evaluate(el=>({text:el.innerText.trim(),height:el.getBoundingClientRect().height,display:getComputedStyle(el).display,visibility:getComputedStyle(el).visibility}));
  assert.ok(content.text.length>80,`${label}: main text did not render`);
  assert.ok(content.height>120&&content.display!=='none'&&content.visibility!=='hidden',`${label}: main content is not visible`);
  assert.deepEqual(errors,[],`${label}: browser errors detected\n${errors.join('\n')}`);
  await context.close();
}

'''
          if 'sitewide ${pageName}' not in js:
            js=js.replace('await browser.close();',sitewide+'await browser.close();',1)
          test.write_text(js,encoding='utf-8')
          PY
          git add assets/watch.mjs tests/browser-mobile.mjs watch.html
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain:'
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - name: Verify merged Node suite
        run: |
          node --check assets/watch.mjs
          node --check assets/watch-mobile.mjs
          node --check assets/watch-video.mjs
          node --test tests/*.test.mjs
      - name: Install pinned browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify merged phones, leaderboard, playback and all pages
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hynoe-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/watch.html >/dev/null && break; sleep 1; done
          node tests/browser-mobile.mjs
      - name: Commit and push verified merge
        run: |
          git add -A
          git commit -m "Merge latest main into mobile sitewide refresh"
          git push origin HEAD:fix/mobile-sitewide-refresh-20261006
