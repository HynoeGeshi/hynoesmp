name: Apply restored-run mobile fix

on:
  push:
    branches:
      - fix/restore-active-run-mobile-20261006
    paths:
      - '.github/workflows/apply-active-run-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-active-run-mobile-20261006
          fetch-depth: 0
      - name: Patch active cave render and bump browser release
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/watch.mjs')
          text = path.read_text()
          old = "$('run-guard').disabled=run.ready||!run.rations||run.hp>=100;$('run-guard').textContent='Fortify · '+(run.rations||0)+' rations';$('run-guard').querySelector('small').textContent=run.hp>=100?'Take damage first':'Recover health before the next crossing';"
          new = "const guard=$('run-guard');guard.disabled=run.ready||!run.rations||run.hp>=100;guard.firstChild.nodeValue='🛡 Fortify · '+(run.rations||0)+' rations';guard.querySelector('small').textContent=run.hp>=100?'Take damage first':'Recover health before the next crossing';"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one active-run guard bug, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          changed = []
          for root in (Path('.'),):
              for p in root.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                      continue
                  if p.suffix not in {'.html', '.mjs', '.css'}:
                      continue
                  raw = p.read_text(errors='strict')
                  if '20261006c' in raw:
                      p.write_text(raw.replace('20261006c', '20261006d'))
                      changed.append(str(p))
          print('Release token updated in:', *changed, sep='\n- ')
          PY
          git diff --check
          git diff --stat
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets watch.html index.html start.html mca.html progression.html economy.html bosses.html join.html modpack.html updates.html modded-minecraft-server.html privacy.html terms.html data-deletion.html community-rules.html tests 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore active cave run mine rendering'
          git push origin HEAD:fix/restore-active-run-mobile-20261006
