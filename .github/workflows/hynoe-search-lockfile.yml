name: Hynoe Search Lockfile

on:
  push:
    branches:
      - hynoe-search-phase2a-impl
    paths:
      - 'hynoe-search-app/package.json'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: "!contains(github.event.head_commit.message, 'lockfile:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hynoe-search-phase2a-impl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh npm lockfile
        working-directory: hynoe-search-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hynoe-search-app/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "lockfile: pin Phase 2A auth dependencies"
          git push origin HEAD:hynoe-search-phase2a-impl
