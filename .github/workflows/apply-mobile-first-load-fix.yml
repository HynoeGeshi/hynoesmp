name: Apply mobile first-load blocker fix

on:
  push:
    branches:
      - fix/mobile-first-load-blocker-20261006
    paths:
      - '.github/workflows/apply-mobile-first-load-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove forced guide and bump interactive release
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('assets/watch.mjs')
          s=p.read_text()
          old="""try{if(!localStorage.getItem('hynoeDeepDeeperGuideV3')){localStorage.setItem('hynoeDeepDeeperGuideV3','seen');setTimeout(()=>{if(!guide.open)guide.showModal();},450);}}catch{}"""
          if old not in s:
              raise SystemExit('expected forced guide block not found')
          s=s.replace(old,'')
          p.write_text(s)

          graph=['watch.html','assets/watch.mjs','assets/watch-mobile.mjs','assets/watch-game.mjs','assets/watch-command.mjs','assets/watch-session.mjs','assets/watch-video.mjs','assets/leaderboard-live.mjs','tests/mobile-outpost.test.mjs']
          changed=[]
          for name in graph:
              q=Path(name)
              if not q.exists():
                  continue
              text=q.read_text()
              newer=text.replace('20261006b','20261006c')
              if newer!=text:
                  q.write_text(newer)
                  changed.append(name)
          print('release-bumped:', ', '.join(changed))
          PY
      - name: Strengthen repeated touch test
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/browser-first-load.mjs')
          s=p.read_text()
          needle="""    assert.ok(after>before,`${label}: first physical tap did not register (${before} -> ${after})`);\n\n    await page.locator('#open-help').click();"""
          repl="""    assert.ok(after>before,`${label}: first physical tap did not register (${before} -> ${after})`);\n\n    const repeatedBefore=after;\n    for(let i=0;i<20;i++){\n      await vein.tap({timeout:3000});\n      await page.waitForTimeout(18);\n    }\n    await page.waitForTimeout(150);\n    const repeatedAfter=Number((await page.locator('#ore').textContent())||0);\n    assert.ok(repeatedAfter>=repeatedBefore+20,`${label}: repeated physical taps were lost or blocked (${repeatedBefore} -> ${repeatedAfter})`);\n\n    await page.locator('#open-help').click();"""
          if needle not in s:
              raise SystemExit('tap test insertion point not found')
          p.write_text(s.replace(needle,repl))
          PY
      - name: Verify syntax and full Node suite
        run: |
          node --check assets/watch.mjs
          node --check assets/watch-mobile.mjs
          node --check assets/watch-video.mjs
          node --test tests/*.test.mjs
      - name: Install Chromium and run all mobile browser gates
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hynoe-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/watch.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-mobile.mjs
          node tests/browser-first-load.mjs
      - name: Remove temporary workflow and generated browser artifacts
        run: |
          rm -f .github/workflows/apply-mobile-first-load-fix.yml
          rm -rf node_modules test-artifacts package-lock.json
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep Hynoe Outpost playable on first mobile load'
          git push origin HEAD:fix/mobile-first-load-blocker-20261006
