name: Live mobile production probe v2
on:
  push:
    branches: [debug/live-mobile-production-20261006]
    paths: ['.github/workflows/live-mobile-production-probe-v2.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run live phone matrix
        run: |
          cat > live-probe.mjs <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const width of [320,360,375,390,412,430]){
            const context=await browser.newContext({viewport:{width,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            await page.goto('https://hynoesmp.com/watch.html?probe='+Date.now()+'-'+width,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1000);
            const info=await page.evaluate(()=>{
              const d=document.querySelector('#how-to-play'),v=document.querySelector('#vein-0'),f=v?.querySelector('.gem-face'),b=v?.querySelector('.rock-base'),r=v?.getBoundingClientRect();
              const at=r?document.elementsFromPoint(r.left+r.width/2,Math.min(innerHeight-1,Math.max(0,r.top+r.height/2))).slice(0,6).map(e=>e.id||e.className||e.tagName):[];
              return {dialogOpen:!!d?.open,dialogRect:d?.getBoundingClientRect().toJSON(),oreVar:v?.style.getPropertyValue('--ore'),faceFill:f?getComputedStyle(f).fill:null,baseFill:b?getComputedStyle(b).fill:null,veinPointer:v?getComputedStyle(v).pointerEvents:null,veinRect:r?.toJSON(),stack:at,ore:document.querySelector('#ore')?.textContent};
            });
            let blockedTap='';
            try{await page.locator('#vein-0').tap({timeout:1500});}catch(e){blockedTap=e.message.split('\n')[0];}
            const oreAfterBlocked=await page.locator('#ore').textContent();
            await page.evaluate(()=>document.querySelector('#how-to-play')?.close());
            await page.locator('#vein-0').scrollIntoViewIfNeeded();
            const before=await page.locator('#ore').textContent();
            await page.locator('#vein-0').tap({timeout:3000});
            await page.waitForTimeout(150);
            const after=await page.locator('#ore').textContent();
            await page.goto('https://hynoesmp.com/?probe='+Date.now()+'-'+width,{waitUntil:'networkidle',timeout:60000});
            const home=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,innerWidth,center:document.elementsFromPoint(innerWidth/2,innerHeight/2).slice(0,6).map(e=>e.id||e.className||e.tagName)}));
            console.log(JSON.stringify({width,info,blockedTap,oreAfterBlocked,before,after,home}));
            await context.close();
          }
          await browser.close();
          EOF
          node live-probe.mjs
