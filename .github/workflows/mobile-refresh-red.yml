name: Mobile refresh red gate

on:
  push:
    branches:
      - fix/mobile-sitewide-refresh-20261006

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run site regressions
        run: node --test tests/*.test.mjs
