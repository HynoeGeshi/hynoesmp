name: Harden Hynoe chat moderation

on:
  push:
    branches:
      - feature/hynoe-community-20261006-final
    paths:
      - .github/workflows/apply-moderation-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hynoe-community-20261006-final
      - name: Harden moderation normalization and censoring
        shell: python
        run: |
          from pathlib import Path
          p=Path('relay/worker.mjs')
          text=p.read_text()
          old="s=s.replace(/[^a-z0-9]+/g,' ').replace(/\\s+/g,' ').trim();\n s=s.replace(/\\bk\\s+i\\s+l\\s+l\\s+y\\s+o\\s+u\\b/g,'kill you');\n s=s.replace(/\\bk\\s+i\\s+l\\s+l\\s+y\\s+o\\s+u\\s+r\\s+s?\\s+e\\s+l\\s+f\\b/g,'kill yourself');"
          new="s=s.replace(/[^a-z0-9]+/g,' ').replace(/\\s+/g,' ').trim();\n s=s.replace(/\\b(?:[a-z0-9]\\s+){2,}[a-z0-9]\\b/g,part=>part.replace(/\\s+/g,''));\n s=s.replace(/\\bkillyou\\b/g,'kill you').replace(/\\bkillyourself\\b/g,'kill yourself');"
          if old not in text: raise SystemExit('normalization block not found')
          text=text.replace(old,new,1)
          old2="let censored=false;\n const safe=String(text).replace(PROFANITY,word=>{censored=true;return word[0]+'*'.repeat(Math.max(1,word.length-1));});\n PROFANITY.lastIndex=0;\n return {action:censored?'censor':'allow',text:safe};"
          new2="let censored=false;\n let safe=String(text).replace(PROFANITY,word=>{censored=true;return word[0]+'*'.repeat(Math.max(1,word.length-1));});\n PROFANITY.lastIndex=0;\n const normalizedProfanity=/\\b(?:fuck(?:ing|ed|er|s)?|shit(?:ty|s)?|bitch(?:es)?|asshole(?:s)?)\\b/i;\n if(!censored&&normalizedProfanity.test(normalized)){const evasive=[/f[\\W_]*u[\\W_]*c[\\W_]*k(?:[\\W_]*(?:i[\\W_]*n[\\W_]*g|e[\\W_]*d|e[\\W_]*r|s))?/gi,/s[\\W_]*h[\\W_]*i[\\W_]*t(?:[\\W_]*(?:t[\\W_]*y|s))?/gi,/b[\\W_]*i[\\W_]*t[\\W_]*c[\\W_]*h(?:[\\W_]*e[\\W_]*s)?/gi,/a[\\W_]*s[\\W_]*s[\\W_]*h[\\W_]*o[\\W_]*l[\\W_]*e(?:[\\W_]*s)?/gi];for(const pattern of evasive)safe=safe.replace(pattern,word=>{censored=true;const letters=word.replace(/[^A-Za-z0-9]/g,'');return letters[0]+'*'.repeat(Math.max(3,letters.length-1));});}\n return {action:censored?'censor':'allow',text:safe};"
          if old2 not in text: raise SystemExit('moderation censor block not found')
          text=text.replace(old2,new2,1)
          p.write_text(text)
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/worker.mjs
          if git diff --cached --quiet; then
            echo "No moderation changes"
          else
            git commit -m "fix: harden Global Chat filter evasion handling"
            git push origin HEAD:feature/hynoe-community-20261006-final
          fi
