name: Fix privacy hold copy

on:
  push:
    branches:
      - fix-privacy-hold-copy-2026-10-05
    paths:
      - '.github/workflows/fix-privacy-hold-copy.yml'
      - '.github/scripts/fix-privacy-hold-copy.py'
      - 'tests/privacy-hold-copy.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message || '', '[privacy-hold-copy-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm regression is red
        run: |
          if node --test tests/privacy-hold-copy.test.mjs; then
            echo "Privacy-hold copy regression unexpectedly already passes."
            exit 1
          else
            echo "Confirmed: misleading sync copy is present before the repair."
          fi
      - name: Apply privacy-hold copy repair
        run: python .github/scripts/fix-privacy-hold-copy.py
      - name: Verify repair and full suite
        run: |
          node --check assets/watch.mjs
          node --test tests/privacy-hold-copy.test.mjs
          node --test tests/*.test.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.html assets/watch.mjs
          git commit -m "fix: make privacy-hold leaderboard copy consistent [privacy-hold-copy-fixed]"
          git push origin HEAD:fix-privacy-hold-copy-2026-10-05
