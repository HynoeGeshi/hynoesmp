<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CreatorOps Admin</title><link rel="stylesheet" href="./creatorops.css"></head><body><main class="shell section"><p class="eyebrow">Private operator surface</p><h1 style="font-size:clamp(2.4rem,7vw,4.5rem)">CreatorOps Admin</h1><p class="muted">Applications are fetched through the authenticated Render backend. No database key is exposed to this page.</p><div class="hero-actions"><button id="refresh" class="button primary">Refresh applications</button><a class="button ghost" href="/creatorops">Public site</a></div><p id="admin-status" class="form-status" role="status"></p><div id="applications" class="feature-grid" style="grid-template-columns:1fr"></div></main><script>
const root=document.querySelector('#applications'),statusEl=document.querySelector('#admin-status');
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){statusEl.textContent='Loading…';const r=await fetch('/api/admin/applications',{credentials:'same-origin'});if(!r.ok){statusEl.textContent='Unable to load applications.';return}const j=await r.json();root.innerHTML=(j.applications||[]).map(a=>`<article><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><span class="eyebrow">${esc(a.status)}</span><h3>${esc(a.creator_name)}</h3></div><small>${esc(new Date(a.created_at).toLocaleString())}</small></div><p><strong>${esc(a.primary_platform)}</strong> · <a href="${esc(a.profile_url)}" rel="noreferrer" target="_blank">profile</a> · ${esc(a.email)}</p><p><strong>Goal:</strong> ${esc(a.goal)}</p><p><strong>Bottleneck:</strong> ${esc(a.bottleneck)}</p><p><strong>Interest:</strong> ${esc(a.interest)} · <strong>Revenue:</strong> ${esc(a.revenue)}</p><select data-id="${esc(a.id)}"><option ${a.status==='new'?'selected':''}>new</option><option ${a.status==='reviewing'?'selected':''}>reviewing</option><option ${a.status==='qualified'?'selected':''}>qualified</option><option ${a.status==='contacted'?'selected':''}>contacted</option><option ${a.status==='closed'?'selected':''}>closed</option></select></article>`).join('')||'<p class="muted">No applications yet.</p>';root.querySelectorAll('select[data-id]').forEach(el=>el.addEventListener('change',async()=>{const r=await fetch('/api/admin/status',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id:el.dataset.id,status:el.value})});statusEl.textContent=r.ok?'Status updated.':'Status update failed.'}));statusEl.textContent=`${(j.applications||[]).length} application(s)`}
document.querySelector('#refresh').addEventListener('click',load);load();
</script></body></html>
