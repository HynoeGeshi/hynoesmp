name = "hynoe-community"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://hynoesmp.com,https://www.hynoesmp.com"
CHAT_ENABLED = "false"

# Private secrets are configured with Wrangler and must never be committed:
# TURNSTILE_SECRET, IP_SALT, SESSION_SECRET, ADMIN_TOKEN

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
