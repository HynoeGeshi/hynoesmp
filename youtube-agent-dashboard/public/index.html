<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hynoe YouTube Agent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">HYNOE CREATOROPS</p><h1>YouTube Agent</h1><p id="status">Sign in to review Shorts.</p></header>
    <section id="authPanel" class="panel">
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
    </section>
    <section id="reviewPanel" class="hidden">
      <div class="toolbar"><strong>Shorts review queue</strong><button id="signOut" type="button">Sign out</button></div>
      <div id="candidateList" class="cards"></div>
      <details id="rejectedHistory" class="panel">
        <summary id="rejectedSummary">Rejected history</summary>
        <div id="rejectedList" class="cards"></div>
      </details>
    </section>
  </main>
  <script src="/config.js"></script>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
